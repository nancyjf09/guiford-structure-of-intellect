<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guilford’s Structure of Intellect – 3D Interactive Model</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0b0724;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(circle at 30% 20%,#2b1067 0,#0b0724 60%,#05031a 100%)}
header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:10px 14px;z-index:5;background:linear-gradient(#0b0724ee,#0b072400)}
header img{width:62px;height:auto;filter:drop-shadow(0 0 8px #fff8)}
h1{margin:0;font-size:clamp(15px,2.6vw,24px);background:linear-gradient(90deg,#ff5fa2,#ffd23f,#3ddc97,#4cc9f0);-webkit-background-clip:text;background-clip:text;color:transparent}
.who{font-size:clamp(11px,1.6vw,14px);line-height:1.35;color:#e8e2ff}.who b{color:#ffd23f}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#info{display:none;position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 28px));max-height:40vh;overflow-y:auto;background:#150e3acc;border:1px solid #ffffff33;border-radius:16px;padding:14px;backdrop-filter:blur(8px);z-index:5}
#info h2{margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#bfb2ff}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;padding:8px 10px;border-radius:10px;background:#ffffff12;border-left:6px solid var(--c,#888)}
.row small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.row span{font-size:18px;font-weight:700}
.ex span{font-size:14px;font-weight:500;line-height:1.4}
#exp{display:none;position:absolute;top:122px;right:14px;width:min(340px,calc(100% - 200px));max-height:44vh;overflow-y:auto;background:#150e3acc;border:1px solid #ffffff33;border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px);z-index:6;font-size:12.5px;line-height:1.45}
#exp h2{margin:0 0 6px;font-size:14px;letter-spacing:.12em;color:#ffd23f}#exp p{margin:0 0 6px;color:#e8e2ff}
.ei{margin:5px 0;padding:6px 8px;border-left:6px solid var(--c);border-radius:8px;background:#ffffff10;opacity:.55}.ei.sel{opacity:1;background:#ffffff2e}
.n{font-size:20px;font-weight:800;opacity:.9;width:20px}
#hint{font-size:12px;color:#d8d0ff;margin:0}
#leg{position:absolute;left:10px;top:84px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(172px,42vw);overflow-y:auto;font-size:11px;z-index:5;background:#150e3acc;border:1px solid #ffffff33;border-radius:12px;padding:6px 8px;backdrop-filter:blur(8px)}
#leg h3{margin:8px 0 3px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#bfb2ff}
#leg button{display:block;width:100%;text-align:left;margin:2px 0;padding:4px 7px;font:inherit;color:#fff;background:#ffffff14;border:0;border-left:7px solid var(--c,#888);border-radius:6px;cursor:pointer}
#leg button:hover{background:#ffffff30}
#leg button.on{background:var(--c);color:#111;font-weight:700}
#leg #all{margin-top:8px;border-left-color:#fff;text-align:center}
#hintbar{position:absolute;top:84px;right:14px;margin:0;font-size:12px;color:#d8d0ff;text-align:right;max-width:46vw;z-index:4}

</style></head><body>

<div><h1>Guilford’s Structure of Intellect (SOI) – 3D Model</h1>
<div class="who"><b>Dr. Nancy J. Fernandez</b>, Associate Professor<br>Karmela Rani Training College, Kollam</div></div></header>
<canvas id="c"></canvas>
<div id="leg"></div><div id="exp"></div><p id="hintbar">Click a cube or a legend item · drag to rotate · scroll/pinch to zoom</p>
<div id="info"><h2>Selected cell</h2>
<div id="cell"><p id="hint">Click any cube. Drag to rotate, scroll or pinch to zoom.</p></div></div>
<script>
const CONTENT=["Visual","Auditory","Symbolic","Semantic","Behavioral"];
const OPS=["Cognition","Memory recording","Memory retention","Divergent production","Convergent production","Evaluation"];
const PROD=["Units","Classes","Relations","Systems","Transformations","Implications"];
const OPC=["#ff3d81","#ff9f1c","#ffd60a","#2ee59d","#2cb5ff","#a66cff"];
const CC=["#00e5ff","#ff4d6d","#f4e04d","#7cfc00","#c77dff"];
const PC=["#ff6b35","#00c2a8","#f72585","#4361ee","#ffbe0b","#80ed99"];
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1,.1,100);
S.add(new THREE.AmbientLight(0xffffff,.75));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(6,10,8);S.add(dl);
const G=new THREE.Group();S.add(G);
G.rotation.set(.45,-.6,0);
const cubes=[];
for(let x=0;x<5;x++)for(let y=0;y<6;y++)for(let z=0;z<6;z++){
 const cols=[CC[x],CC[x],PC[y],PC[y],OPC[z],OPC[z]];
 const m=new THREE.Mesh(new THREE.BoxGeometry(.88,.88,.88),cols.map(c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.25,transparent:true,opacity:.95,roughness:.35,metalness:.2})));
 m.position.set(x-2,2.5-y,z-2.5);m.userData={x,y,z,cols};G.add(m);cubes.push(m);
 m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.35})));
}
function label(t,c,s=1,al='center',rot=0){const k=document.createElement('canvas');k.width=768;k.height=96;const g=k.getContext('2d');
 g.font='bold 46px Segoe UI,Arial';g.textAlign=al;g.textBaseline='middle';g.shadowColor=c;g.shadowBlur=14;g.fillStyle='#fff';g.fillText(t,al=='right'?756:al=='left'?12:384,48);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),transparent:true,depthTest:false}));sp.scale.set(5.1*s,.64*s,1);sp.center.set(al=='right'?1:al=='left'?0:.5,.5);sp.material.rotation=rot;sp.renderOrder=9;return sp}
function add(t,c,p,s,al,rot){const l=label(t,c,s,al,rot);l.position.set(...p);G.add(l)}
const P4=Math.PI/4;
CONTENT.forEach((t,i)=>add(t,CC[i],[i-2,-3.02,2.94],.85,'right',P4));
PROD.forEach((t,j)=>add(t,PC[j],[-2.52,2.5-j,2.94],.85,'right',0));
OPS.forEach((t,k)=>add(t,OPC[k],[2.5,3.02,k-2.5],.85,'left',P4));
add('CONTENT ▸','#ffffff',[3.0,-3.02,2.94],1,'left',0);add('PRODUCTS','#ffffff',[-2.52,3.5,2.94],1,'right',0);add('OPERATIONS ▸','#ffffff',[2.5,3.02,-3.6],1,'left',P4);
const DESC={
x:{t:"CONTENT",i:"It stands for the nature of the material on which intellectual operations are performed. The five contents include:",items:[["Visual (V)","concrete materials perceived through eyes"],["Auditory (A)","concrete materials perceived through ears"],["Symbolic (S)","letters, digits and signs used in our communication system"],["Semantic (M)","perceived meaning of verbal information (language)"],["Behavioral (B)","deals with the perceptions of other's actions and their significance."]]},
z:{t:"OPERATIONS",i:"It stands for what the respondent does. The six operations include:",items:[["Cognition (C)","includes aspects like understanding, comprehending, discovering, and becoming aware of the information. Fundamental operation in learning."],["Memory recording (M)","is the proficiency to integrate and encode information. Ability to store any recognised information."],["Memory retention (M)","is the ability to recollect facts or information. Ability to retain any recognised information."],["Divergent production (D)","describes the ability to think in different directions and develop different ways to solve problems; it also refers to the ability to seek variety, novelty and be creative."],["Convergent production (N)","is the capacity to derive one best answer to problems from a set of rules; it is also known as rule-following or problem-solving. It generates information from the given information."],["Evaluation (E)","is the ability to determine whether a piece of particular information is correct, reliable, or trustworthy. It means reaching conclusions and making decisions about the correctness of what we know, remember and produce."]]},
y:{t:"PRODUCTS",i:"It shows the outcomes of specific operations being applied to specific items in a specific order. It signifies the form in which the respondent processes the information. The six products include:",items:[["Units","are discrete pieces of information."],["Classes","are groups of units that have characteristics in common."],["Relations","are groups of units that are linked together as opposites or in correlations, series, or parallels."],["Systems","are made up of multiple relations that are interconnected to form structures or pathways."],["Transformations","in knowledge include shifts in viewpoint, transitions, and alterations in knowledge."],["Implications","are expectations, conclusions, outcomes, or assumptions of knowledge based on existing information."]]}};
function renderExp(){const e=document.getElementById('exp');if(!flt){e.style.display='none';return}
 const D=DESC[flt.d],C={x:CC,y:PC,z:OPC}[flt.d];
 e.innerHTML=`<h2>${D.t}</h2><p>${D.i.replace(/\s*The (five|six) \w+ include:$/,'')}</p>`+D.items.map((it,i)=>i!=flt.i?'':`<div class="ei${i==flt.i?' sel':''}" style="--c:${C[i]}"><b>${i+1}. ${it[0]}</b> – ${it[1]}</div>`).join('');e.style.display='block';e.scrollTop=0}
let flt=null;
const LG=[["Content","x",CONTENT,CC],["Product","y",PROD,PC],["Operation","z",OPS,OPC]];
const lg=document.getElementById('leg');
lg.innerHTML=LG.map(([n,d,A,C])=>`<h3>${n}</h3>`+A.map((t,i)=>`<button data-d="${d}" data-i="${i}" style="--c:${C[i]}">${t}</button>`).join('')).join('')+'<button id="all">Show all cells</button>';
lg.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='all')flt=null;else{const d=b.dataset.d,i=+b.dataset.i;flt=flt&&flt.d==d&&flt.i==i?null:{d,i}}
 lg.querySelectorAll('button[data-d]').forEach(x=>x.classList.toggle('on',!!flt&&x.dataset.d==flt.d&&+x.dataset.i==flt.i));cubes.forEach(paint);renderExp()};
let sel=null,hov=null;
function paint(m){const d=m.userData,on=m===sel,h=m===hov,ok=!flt||d[flt.d]===flt.i;
 m.material.forEach((mt,k)=>{mt.emissive.set(on?0xffffff:d.cols[k]);mt.emissiveIntensity=on?.7:(ok&&flt)||h?.55:.25;mt.opacity=ok?.95:.06});
 m.children[0].material.opacity=ok?.35:.02;m.scale.setScalar(on?1.18:h?1.08:ok&&flt?1.05:1)}
const VERB=["Recognise","Memorise","Recall from memory","Think up as many varied possibilities as you can for","Arrive at the one correct answer for","Judge the correctness or quality of"];
const SEED=[
["a single shape or picture (e.g. a triangle)","a single sound or spoken word","a single letter or number","the meaning of a single word","a single facial expression or gesture"],
["figures grouped by a shared feature (e.g. all curved shapes)","sounds grouped by type (e.g. string vs wind instruments)","numbers grouped by a property (e.g. primes)","words grouped by meaning (e.g. fruits)","behaviours grouped by type (e.g. helping acts)"],
["how two figures relate (e.g. larger than, mirror image)","how two sounds relate (e.g. higher in pitch)","the relation between symbols (e.g. 2 : 4 :: 3 : 6)","the relation between words (e.g. hot : cold :: day : night)","how two people's actions relate (e.g. cause and response)"],
["a pattern or arrangement of figures (e.g. a map or floor plan)","a melody or rhythm pattern","an equation or number series","a sentence or short passage","a sequence of social interactions (e.g. a classroom routine)"],
["a figure that is rotated, reflected or reshaped","a tune changed in tempo or key","a word rearranged into another (e.g. an anagram)","an idea reworded or reinterpreted (e.g. a proverb restated)","a behaviour that changes with context (e.g. a smile turning to a frown)"],
["what a picture or diagram suggests (e.g. dark clouds \u2192 rain)","what a tone of voice implies","what follows from given numbers (e.g. the next terms of a series)","what a statement leads to (e.g. consequences of a rule)","what a person's actions predict (e.g. their likely next move)"]];
function show(m){document.getElementById('info').style.display='block';const d=m.userData;const rows=[["Content",CONTENT[d.x],CC[d.x]],["Operation",OPS[d.z],OPC[d.z]],["Product",PROD[d.y],PC[d.y]]];
 document.getElementById('cell').innerHTML=rows.map((r,i)=>`<div class="row" style="--c:${r[2]}"><div class="n">${i+1}</div><div><small>${r[0]}</small><span>${r[1]}</span></div></div>`).join('')+`<div class="row ex" style="--c:#fff"><div><small>Example intellectual activity</small><span>${VERB[d.z]} ${SEED[d.y][d.x]}.</span></div></div>`}
const rc=new THREE.Raycaster(),mp=new THREE.Vector2();
function pick(e){const r=cv.getBoundingClientRect();mp.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(mp,cam);const h=rc.intersectObjects(cubes).filter(i=>!flt||i.object.userData[flt.d]===flt.i);return h.length?h[0].object:null}
let drag=false,moved=0,lx=0,ly=0,auto=true,dist=17;
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;auto=false;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);lx=e.clientX;ly=e.clientY;G.rotation.y+=dx*.008;G.rotation.x=Math.max(-1.4,Math.min(1.4,G.rotation.x+dy*.008))}
 else{const o=pick(e);if(o!==hov){const p=hov;hov=o;if(p)paint(p);if(o)paint(o)}}});
cv.addEventListener('pointerup',e=>{drag=false;cv.style.cursor='grab';if(moved<6){const o=pick(e),p=sel;if(o){sel=o;if(p)paint(p);paint(o);show(o)}else{sel=null;if(p)paint(p);document.getElementById('info').style.display='none'}}});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(8,Math.min(26,dist+e.deltaY*.01))},{passive:false});
let pd=0;cv.addEventListener('touchmove',e=>{if(e.touches.length==2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pd)dist=Math.max(8,Math.min(26,dist-(d-pd)*.03));pd=d}},{passive:true});
cv.addEventListener('touchend',()=>pd=0);
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
(function loop(){requestAnimationFrame(loop);if(auto)G.rotation.y+=.003;const narrow=innerWidth<700?1.5:1;cam.position.set(0,0,dist*narrow);cam.lookAt(0,0,0);R.render(S,cam)})();
